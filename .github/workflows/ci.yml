name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Frontend & API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm test:rpc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Forge v1.7.1
        shell: bash
        run: |
          install_dir="$(mktemp -d "$RUNNER_TEMP/forge.XXXXXX")"
          archive="$install_dir/foundry.tar.gz"
          # Official foundry_v1.7.1_linux_amd64.tar.gz release asset.
          curl --fail --location --silent --show-error --retry 3 \
            --retry-max-time 120 --connect-timeout 10 --max-time 60 \
            --header 'Accept: application/octet-stream' --output "$archive" \
            https://api.github.com/repos/foundry-rs/foundry/releases/assets/415095756
          printf '%s  %s\n' 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b' "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" forge
          "$install_dir/forge" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - run: forge fmt --check
      - run: forge build
      - run: forge test
