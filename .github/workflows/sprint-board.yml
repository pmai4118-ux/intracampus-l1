name: Sprint board PR sync

on:
  push:
    branches: [main]
    paths: [.github/workflows/sprint-board.yml]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sprint-board-pr-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SYNC_URL: https://intracampus-l1-sprint.mphung2532.chatgpt.site/api/github/pull-requests
    steps:
      # Use only the base branch workflow. This job never checks out or runs PR code.
      - name: Publish PR numbers, task IDs and states
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          async function request(url, options) {
            const res = await fetch(url, { ...options, redirect: 'error', signal: AbortSignal.timeout(20000) });
            if (!res.ok) throw new Error(`${new URL(url).hostname} returned HTTP ${res.status}`);
            return res;
          }

          const pulls = [];
          const seen = new Set();
          const pullsUrl = new URL(`/repos/${process.env.GITHUB_REPOSITORY}/pulls`, process.env.GITHUB_API_URL);
          pullsUrl.search = 'state=all&base=main&sort=created&direction=asc&per_page=100';
          for (let page = 1; ; page++) {
            pullsUrl.searchParams.set('page', String(page));
            const res = await request(pullsUrl, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });
            for (const pr of await res.json()) {
              if (seen.has(pr.number)) continue;
              seen.add(pr.number);
              const taskIds = [...new Set(
                [...pr.title.matchAll(/\[([a-z]\d{2,}|N-[0-9a-f]{8})\]/gi)].map(match => match[1].toUpperCase()),
              )];
              if (!taskIds.length) continue;
              const status = pr.merged_at ? 'merged' : pr.state === 'closed' ? 'closed' : pr.draft ? 'draft' : 'open';
              pulls.push({ number: pr.number, status, taskIds });
            }
            if (!/;\s*rel="next"/i.test(res.headers.get('link') ?? '')) break;
          }

          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', process.env.SYNC_URL);
          const tokenRes = await request(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          const { value: oidcToken } = await tokenRes.json();
          await request(process.env.SYNC_URL, {
            method: 'POST',
            headers: { 'X-Intracampus-OIDC': oidcToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ pulls }),
          });
          console.log(`Synced ${pulls.length} tagged pull requests.`);
          NODE
